name: Test packaged Windows launchers

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: 'Successful launcher artifact run ID'
        default: '41821807853'
        required: true
  push:
    branches: [main]
    paths: ['.github/workflows/launcher-smoke.yml', 'tools/distribution/smoke-windows.ps1']

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: launcher
          path: packaged
          run-id: ${{ inputs.build_run || '41821807853' }}
          github-token: ${{ github.token }}
      - name: Open the actual packaged applications
        shell: pwsh
        run: ./tools/distribution/smoke-windows.ps1 -PackageDirectory packaged
